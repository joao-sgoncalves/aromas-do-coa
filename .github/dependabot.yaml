version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
      semver-major-days: 28
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      prod-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "node"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
      - "github actions"
